<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОСТАТЬСЯ В ЖИВЫХ</title>
<!-- Подключаем Supabase из надежного CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.39.8/supabase.min.js"></script>
<style>
:root{--void:#15170f;--void-2:#1d2016;--paper:#e9e3d0;--ink:#211d13;--hazard:#d3a026;--danger:#a63d2f;--moss:#5b6b48;}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:radial-gradient(ellipse at top,#1f2317 0%,var(--void) 60%);color:var(--paper);font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;min-height:100vh;padding:24px 16px 60px;}
h1,h2,h3{font-family: 'Arial Black', sans-serif; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:10px;}
h1 { color: var(--hazard); font-size: 2.5rem; text-align: center; margin-bottom: 20px;}
h1 span { color: var(--paper); }
.wrap{max-width:920px;margin:0 auto;}
.hazard-strip{height:10px;background:repeating-linear-gradient(135deg,var(--hazard) 0 18px,#211d13 18px 36px);border-radius:2px;margin:14px 0 22px;}
.panel{background:var(--void-2);border:1px solid #33361f;border-radius:6px;padding:20px;margin-bottom:16px;}
.btn{display:inline-block;font-family:'Arial Black',sans-serif;text-transform:uppercase;letter-spacing:0.05em;font-size:14px;font-weight:600;padding:12px 20px;border-radius:4px;border:none;cursor:pointer; transition: 0.2s;}
.btn:hover { opacity: 0.85; }
.btn-primary{background:var(--hazard);color:#211d13;}
.btn-danger{background:var(--danger);color:white;}
.btn-ghost{background:transparent;color:var(--paper);border:1px solid #4a4e28;}
input { width:100%;padding:12px;margin:8px 0; background: var(--void); border: 1px solid #4a4e28; color: var(--paper); border-radius: 4px; font-size: 16px; }
input::placeholder { color: #888; }
.code-box{font-size:36px;font-weight:700;letter-spacing:0.3em;color:var(--hazard);background:var(--void);border:2px dashed #8a6b1d;border-radius:6px;padding:15px;text-align:center; margin: 15px 0;}
.warning { background:var(--danger); padding:14px; border-radius:4px; margin-bottom:15px; color:white; font-size:14px; border-left:5px solid #ff4a4a; display: none; }
.player-list { list-style: none; }
.player-list li { padding: 12px; background: var(--void); margin: 6px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;}
.host-badge { background: var(--hazard); color: var(--ink); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;}
</style>
</head>
<body>

<div class="wrap" id="app">
    <h1>ОСТАТЬСЯ <span>В ЖИВЫХ</span></h1>
    <p style="text-align:center;">Загрузка игры...</p>
</div>

<script>
// ==========================================
// 1. НАСТРОЙКИ SUPABASE (ПРОВЕРЬТЕ СВОИ ДАННЫЕ)
// ==========================================
const SUPABASE_URL = 'https://dhuqvintfsmbigmvdvak.supabase.co'; 
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRodXF2aW50ZnNtYmlnbXZkdmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwODAxODQsImV4cCI6MjA5ODY1NjE4NH0.badg8idLoAL-Y4sxR7zj9NTHdyKrBdh_Cv90fimAD-4'; // Начинается на eyJ...
// ==========================================

// Безопасная генерация ID (работает даже при открытии файла двойным кликом)
function generateSafeId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        try { return crypto.randomUUID(); } catch(e) {}
    }
    return 'usr_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
}

let supabaseClient = null;
let dbConnected = false;

// Инициализация Supabase
try {
    if (window.supabase && SUPABASE_URL.includes('supabase.co') && !SUPABASE_KEY.includes('ВСТАВЬТЕ')) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        dbConnected = true;
    }
} catch (e) {
    console.error("Ошибка инициализации Supabase:", e);
}

// Состояние игры
let state = {
    playerId: localStorage.getItem('playerId') || generateSafeId(),
    playerName: '',
    currentRoomCode: null,
    roomData: null,
    pollInterval: null
};
// Сохраняем ID, чтобы при обновлении страницы игрок не терялся
localStorage.setItem('playerId', state.playerId);

// Генерация кода комнаты
function genCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let c = '';
    for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
    return c;
}

// === РАБОТА С БАЗОЙ ДАННЫХ ===
async function saveRoom(room) {
    if (!dbConnected) {
        showWarning("База данных не подключена! Проверьте SUPABASE_URL и SUPABASE_KEY в коде.");
        return false;
    }
    try {
        const { error } = await supabaseClient.from('rooms').upsert({ code: room.code, data: room });
        if (error) {
            console.error("Ошибка сохранения:", error);
            showWarning("Ошибка БД: " + error.message);
            return false;
        }
        state.roomData = room;
        return true;
    } catch (e) {
        showWarning("Не удалось связаться с сервером.");
        return false;
    }
}

async function getRoom(code) {
    if (!dbConnected) return null;
    try {
        const { data, error } = await supabaseClient.from('rooms').select('data').eq('code', code).single();
        if (data && !error) return data.data;
    } catch (e) { console.error(e); }
    return null;
}

function startPolling() {
    stopPolling();
    state.pollInterval = setInterval(async () => {
        if (state.currentRoomCode) {
            const room = await getRoom(state.currentRoomCode);
            if (room) {
                // Простая проверка изменений
                if (JSON.stringify(room) !== JSON.stringify(state.roomData)) {
                    state.roomData = room;
                    renderLobby();
                }
            }
        }
    }, 2000);
}

function stopPolling() {
    if (state.pollInterval) {
        clearInterval(state.pollInterval);
        state.pollInterval = null;
    }
}

// === РЕНДЕРИНГ ИНТЕРФЕЙСА ===
function showWarning(msg) {
    const w = document.getElementById('db-warning');
    if (w) {
        w.innerText = "⚠️ " + msg;
        w.style.display = 'block';
    }
}

function renderHome() {
    stopPolling();
    state.currentRoomCode = null;
    state.roomData = null;
    
    let warningHtml = `<div id="db-warning" class="warning"></div>`;
    if (!dbConnected) {
        setTimeout(() => showWarning("База данных не подключена. Проверьте ключи в коде (строки 24-25)."), 100);
    }

    document.getElementById('app').innerHTML = `
        <h1>ОСТАТЬСЯ <span>В ЖИВЫХ</span></h1>
        <div class="hazard-strip"></div>
        ${warningHtml}
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
            <div class="panel">
                <h2>Создать комнату</h2>
                <input id="hostName" placeholder="Ваше имя (Ведущий)" maxlength="20">
                <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="actionCreateRoom()">Создать</button>
            </div>
            <div class="panel">
                <h2>Присоединиться</h2>
                <input id="joinCode" placeholder="Код комнаты (4 буквы/цифры)" maxlength="4" style="text-transform:uppercase;">
                <input id="joinName" placeholder="Ваше имя" maxlength="20">
                <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="actionJoinRoom()">Войти</button>
            </div>
        </div>
    `;
}

function renderLobby() {
    const room = state.roomData;
    if (!room) return renderHome();
    
    const isHost = room.hostId === state.playerId;
    
    let playersHtml = room.players.map(p => `
        <li>
            <span>${p.name} ${p.id === state.playerId ? '(Вы)' : ''}</span>
            ${p.id === room.hostId ? '<span class="host-badge">Ведущий</span>' : ''}
        </li>
    `).join('');

    document.getElementById('app').innerHTML = `
        <h1>ОСТАТЬСЯ <span>В ЖИВЫХ</span></h1>
        <div class="hazard-strip"></div>
        <div class="panel" style="text-align:center;">
            <h3>Код комнаты для друзей:</h3>
            <div class="code-box">${room.code}</div>
            <p>Ожидаем игроков... (${room.players.length})</p>
        </div>
        <div class="panel">
            <h2>Участники</h2>
            <ul class="player-list">${playersHtml}</ul>
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            ${isHost ? `<button class="btn btn-primary" onclick="actionStartGame()">Начать игру</button>` : ''}
            <button class="btn btn-ghost" onclick="actionLeaveRoom()">← Выйти в меню</button>
        </div>
    `;
}

// === ДЕЙСТВИЯ ПОЛЬЗОВАТЕЛЯ ===
async function actionCreateRoom() {
    const name = document.getElementById('hostName').value.trim();
    if (!name) return alert('Введите ваше имя!');
    if (!dbConnected) return alert('База данных не подключена! Проверьте код.');

    const code = genCode();
    const room = {
        code: code,
        hostId: state.playerId,
        phase: 'lobby',
        players: [{ id: state.playerId, name: name }]
    };
    
    state.playerName = name;
    state.currentRoomCode = code;
    
    const success = await saveRoom(room);
    if (success) {
        startPolling();
        renderLobby();
    }
}

async function actionJoinRoom() {
    const code = document.getElementById('joinCode').value.trim().toUpperCase();
    const name = document.getElementById('joinName').value.trim();
    
    if (!code || !name) return alert('Заполните оба поля!');
    if (!dbConnected) return alert('База данных не подключена!');

    const room = await getRoom(code);
    if (!room) return alert('Комната не найдена! Проверьте код.');

    // Проверяем, нет ли уже такого игрока
    if (!room.players.find(p => p.id === state.playerId)) {
        room.players.push({ id: state.playerId, name: name });
    }
    
    state.playerName = name;
    state.currentRoomCode = code;
    
    const success = await saveRoom(room);
    if (success) {
        startPolling();
        renderLobby();
    }
}

function actionStartGame() {
    alert('Логика начала игры (раздача ролей, катастрофы) будет реализована на следующем этапе!');
}

function actionLeaveRoom() {
    if (confirm('Выйти в главное меню? Ваш прогресс в этой комнате будет потерян.')) {
        renderHome();
    }
}

// Запуск приложения
renderHome();
</script>
</body>
</html>
