<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОСТАТЬСЯ В ЖИВЫХ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
:root{--void:#15170f;--void-2:#1d2016;--paper:#e9e3d0;--ink:#211d13;--hazard:#d3a026;--hazard-dim:#8a6b1d;--danger:#a63d2f;--moss:#5b6b48;--redact:#141410;}
*{box-sizing:border-box;}
body{margin:0;background:radial-gradient(ellipse at top,#1f2317 0%,var(--void) 60%);color:var(--paper);font-family:'IBM Plex Mono',monospace;min-height:100vh;padding:24px 16px 60px;}
h1,h2,h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;margin:0;}
.wrap{max-width:920px;margin:0 auto;}
.hazard-strip{height:10px;background:repeating-linear-gradient(135deg,var(--hazard) 0 18px,var(--ink) 18px 36px);border-radius:2px;margin:14px 0 22px;opacity:0.9;}
.brand{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.brand h1{font-size:clamp(24px,5vw,40px);color:var(--paper);}
.brand h1 span{color:var(--hazard);}
.panel{background:var(--void-2);border:1px solid #33361f;border-radius:6px;padding:20px;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--hazard);margin-bottom:6px;}
.field input,.field textarea,.field select{width:100%;padding:10px 11px;background:var(--void);border:1px solid #444722;color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:14px;border-radius:4px;}
.btn{display:inline-block;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.05em;font-size:13px;font-weight:600;padding:11px 18px;border-radius:4px;border:none;cursor:pointer;}
.btn-primary{background:var(--hazard);color:var(--ink);}
.btn-ghost{background:transparent;color:var(--paper);border:1px solid #4a4e28;}
.code-box{font-size:32px;font-weight:700;letter-spacing:0.3em;color:var(--hazard);background:var(--void);border:2px dashed var(--hazard-dim);border-radius:6px;padding:12px 8px;text-align:center;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const STORAGE_PREFIX = 'ostatsya_';
let state = {playerId: crypto.randomUUID(), playerName:'', code:null, room:null};

function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<4;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}

function saveRoom(room){
  localStorage.setItem(STORAGE_PREFIX + 'room_' + room.code, JSON.stringify(room));
  state.room = room;
  render();
}

function getRoom(code){
  try{
    const data = localStorage.getItem(STORAGE_PREFIX + 'room_' + code);
    return data ? JSON.parse(data) : null;
  }catch(e){ return null; }
}

function render(){
  document.getElementById('app').innerHTML = state.room ? renderRoom() : renderHome();
}

function renderHome(){
  return `
    <div class="brand"><h1>ОСТАТЬСЯ <span>В ЖИВЫХ</span></h1></div>
    <div class="hazard-strip"></div>
    <div class="panel">
      <h2>Создать комнату</h2>
      <div class="field"><label>Твоё имя</label><input id="hostName" placeholder="Игорь"></div>
      <button class="btn btn-primary" onclick="createRoom()">Создать</button>
    </div>
    <div class="panel">
      <h2>Присоединиться</h2>
      <div class="field"><label>Код комнаты</label><input id="joinCode" placeholder="ABCD" maxlength="4"></div>
      <div class="field"><label>Твоё имя</label><input id="joinName" placeholder="Марина"></div>
      <button class="btn btn-primary" onclick="joinRoom()">Войти</button>
    </div>
  `;
}

function createRoom(){
  const name = document.getElementById('hostName').value.trim();
  if(!name) return alert("Введи имя");
  const code = genCode();
  const room = {code, hostId:state.playerId, phase:'lobby', players:[{id:state.playerId, name, alive:true}]};
  state.playerName = name;
  state.code = code;
  saveRoom(room);
}

function joinRoom(){
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  const name = document.getElementById('joinName').value.trim();
  if(!code || !name) return alert("Заполни поля");
  let room = getRoom(code);
  if(!room) return alert("Комната не найдена");
  room.players.push({id:state.playerId, name, alive:true});
  state.playerName = name;
  state.code = code;
  saveRoom(room);
}

function renderRoom(){
  return `<div class="panel"><h2>Комната ${state.code}</h2><p>Пока что просто тест. Скоро добавим всё остальное.</p><button class="btn btn-ghost" onclick="leaveRoom()">Выйти</button></div>`;
}

window.leaveRoom = () => { state.room=null; render(); };

render();
</script>
</body>
</html>
