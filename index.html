<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОСТАТЬСЯ В ЖИВЫХ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
:root{--void:#15170f;--void-2:#1d2016;--paper:#e9e3d0;--ink:#211d13;--hazard:#d3a026;--danger:#a63d2f;--moss:#5b6b48;}
*{box-sizing:border-box;}
body{margin:0;background:radial-gradient(ellipse at top,#1f2317 0%,var(--void) 60%);color:var(--paper);font-family:'IBM Plex Mono',monospace;min-height:100vh;padding:24px 16px 60px;}
h1,h2,h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;margin:0;}
.wrap{max-width:920px;margin:0 auto;}
.hazard-strip{height:10px;background:repeating-linear-gradient(135deg,var(--hazard) 0 18px,#211d13 18px 36px);border-radius:2px;margin:14px 0 22px;}
.panel{background:var(--void-2);border:1px solid #33361f;border-radius:6px;padding:20px;margin-bottom:16px;}
.btn{display:inline-block;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.05em;font-size:13px;font-weight:600;padding:11px 18px;border-radius:4px;border:none;cursor:pointer;}
.btn-primary{background:var(--hazard);color:#211d13;}
.btn-danger{background:var(--danger);color:white;}
.btn-ghost{background:transparent;color:var(--paper);border:1px solid #4a4e28;}
.code-box{font-size:36px;font-weight:700;letter-spacing:0.3em;color:var(--hazard);background:var(--void);border:2px dashed #8a6b1d;border-radius:6px;padding:15px;text-align:center;}
</style>
</head>
<body>
<div class="wrap" id="app">Загрузка игры...</div>

<script>
// ==========================================
// НАСТРОЙКИ ПОДКЛЮЧЕНИЯ К ТВОЕЙ БАЗЕ ДАННЫХ:
// ==========================================
const SUPABASE_URL = 'https://dhuqvintfsmbigmvdvak.supabase.co';

// Аккуратно вставь свой длинный anon/public ключ между одинарными кавычками:
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRodXF2aW50ZnNtYmlnbXZkdmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwODAxODQsImV4cCI6MjA5ODY1NjE4NH0.badg8idLoAL-Y4sxR7zj9NTHdyKrBdh_Cv90fimAD-4';
// ==========================================

let supabase = null;

// Безопасная генерация ID игрока
function generateSafeId() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) {
    return crypto.randomUUID();
  }
  return 'usr_' + Math.random().toString(36).substring(2, 15);
}

const TRAITS = {
  profession: ["Врач", "Инженер", "Военный", "Учитель", "Фермер", "Механик"],
  age: ["25 лет", "34 года", "47 лет", "61 год"],
  health: ["Здоров", "Хромает", "Аллергия", "Слабое сердце"],
  hobby: ["Стрелок", "Медик", "Механик", "Повар"]
};

let state = {
  playerId: generateSafeId(),
  playerName: '',
  code: null,
  room: null,
  pollInterval: null
};

// Функция умной загрузки библиотеки Supabase (защита от зависания серверов)
function loadSupabaseScript() {
  return new Promise((resolve) => {
    if (window.supabase) return resolve(true);
    const script = document.createElement('script');
    // Пробуем первый независимый сервер (unpkg)
    script.src = 'https://unpkg.com/@supabase/supabase-js@2';
    script.onload = () => resolve(true);
    script.onerror = () => {
      // Если он недоступен, пробуем запасной сервер (jsdelivr)
      const script2 = document.createElement('script');
      script2.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      script2.onload = () => resolve(true);
      script2.onerror = () => resolve(false);
      document.head.appendChild(script2);
    };
    document.head.appendChild(script);
  });
}

function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = ''; for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}

async function saveRoom(room) {
  if (!supabase) return alert('База данных не подключена! Проверьте ключи в коде.');
  try {
    const { data, error } = await supabase
      .from('rooms')
      .upsert({ code: room.code, data: room });
    
    if (!error) {
      state.room = room;
      render();
    } else {
      alert('Ошибка базы данных: ' + error.message);
    }
  } catch (e) {
    alert('Не удалось отправить данные: ' + e.message);
  }
}

async function getRoom(code) {
  if (!supabase) return null;
  try {
    const { data, error } = await supabase
      .from('rooms')
      .select('data')
      .eq('code', code)
      .single();
    if (data) return data.data;
  } catch(e) {
    console.error(e);
  }
  return null;
}

function startPolling() {
  if (state.pollInterval) clearInterval(state.pollInterval);
  state.pollInterval = setInterval(async () => {
    if (state.code) {
      const room = await getRoom(state.code);
      if (room && JSON.stringify(room) !== JSON.stringify(state.room)) {
        state.room = room;
        render();
      }
    }
  }, 2000);
}

function stopPolling() {
  if (state.pollInterval) {
    clearInterval(state.pollInterval);
    state.pollInterval = null;
  }
}

function render() {
  const appDiv = document.getElementById('app');
  if (appDiv) {
    appDiv.innerHTML = state.room ? renderRoom(state.room) : renderHome();
  }
}

function renderHome() {
  let warning = '';
  if (!supabase) {
    warning = `<div style="background:var(--danger); padding:14px; border-radius:4px; margin-bottom:15px; color:white; font-size:13px; border-left:5px solid #ff4a4a; line-height:1.4;">
      ⚠️ ИГРА РАБОТАЕТ В ОФЛАЙН-РЕЖИМЕ (БАЗА НЕ ПОДКЛЮЧЕНА)<br>
      • Убедитесь, что вы заменили текст 'СЮДА_ВСТАВЬ...' на ваш реальный длинный ключ (начинается на eyJ).<br>
      • Проверьте подключение к интернету.
    </div>`;
  }
  return `
    <div class="brand"><h1>ОСТАТЬСЯ <span>В ЖИВЫХ</span></h1></div>
    <div class="hazard-strip"></div>
    ${warning}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <div class="panel">
        <h2>Создать комнату</h2>
        <input id="hostName" placeholder="Твоё имя (ведущий)" style="width:100%;padding:12px;margin:10px 0;">
        <button class="btn btn-primary" onclick="actionCreateRoom()">Создать</button>
      </div>
      <div class="panel">
        <h2>Присоединиться</h2>
        <input id="joinCode" placeholder="Код комнаты" maxlength="4" style="width:100%;padding:12px;margin:10px 0;text-transform:uppercase;">
        <input id="joinName" placeholder="Твоё имя" style="width:100%;padding:12px;margin:10px 0;">
        <button class="btn btn-primary" onclick="actionJoinRoom()">Войти</button>
      </div>
    </div>
  `;
}

function renderRoom(room) {
  const isHost = room.hostId === state.playerId;
  let html = `
    <div class="brand"><h1>ОСТАТЬСЯ <span>В ЖИВЫХ</span></h1><span class="sub">КОД: ${room.code}</span></div>
    <div class="hazard-strip"></div>
    <div class="panel">
      <div class="code-box">${room.code}</div>
      <h2>Участники (${room.players.length})</h2>
      <ul style="list-style:none;padding:0;">${room.players.map(p => `<li style="padding:10px;background:#1d2016;margin:5px 0;">${p.name} ${isHost && p.id === room.hostId ? '(Ведущий)' : ''}</li>`).join('')}</ul>
    </div>
  `;

  if (isHost) {
    html += `<button class="btn btn-primary" onclick="actionStartGame()">Начать игру</button>`;
  }
  html += `<button class="btn btn-ghost" onclick="actionLeaveRoom()" style="margin-top:10px; margin-left: 10px;">← В главное меню</button>`;
  return html;
}

async function actionCreateRoom() {
  const name = document.getElementById('hostName').value.trim();
  if (!name) return alert('Введите имя!');
  
  const code = genCode();
  const room = { code, hostId: state.playerId, phase: 'lobby', players: [{id: state.playerId, name, traits: {}}] };
  
  state.playerName = name;
  state.code = code;
  await saveRoom(room);
  startPolling();
}

async function actionJoinRoom() {
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  const name = document.getElementById('joinName').value.trim();
  if (!code || !name) return alert('Заполните поля!');
  
  let room = await getRoom(code);
  if (!room) return alert('Комната не найдена!');
  
  room.players.push({id: state.playerId, name, traits: {}});
  state.playerName = name;
  state.code = code;
  await saveRoom(room);
  startPolling();
}

async function actionStartGame() {
  if (state.room) {
    state.room.phase = 'game';
    state.room.players.forEach(p => {
      p.traits = {
        profession: TRAITS.profession[Math.floor(Math.random()*TRAITS.profession.length)],
        age: TRAITS.age[Math.floor(Math.random()*TRAITS.age.length)]
      };
    });
    await saveRoom(state.room);
    alert('Игра началась!');
  }
}

function actionLeaveRoom() {
  if (confirm('Выйти в главное меню?')) {
    state.room = null;
    state.code = null;
    stopPolling();
    render();
  }
}

// Главная управляющая функция
async function main() {
  // 1. Рисуем меню МГНОВЕННО, не дожидаясь загрузок
  render();
  
  // 2. Если ключ не вставлен, остаемся в режиме предупреждения
  if (!SUPABASE_KEY || SUPABASE_KEY.includes('СЮДА_ВСТАВЬ')) {
    return;
  }
  
  // 3. Скачиваем библиотеку Supabase в фоновом режиме
  const loaded = await loadSupabaseScript();
  if (loaded && window.supabase) {
    try {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      render(); // Перерисовываем меню (красная плашка пропадет, если всё ок)
    } catch(e) {
      console.error("Ошибка инициализации Supabase:", e);
    }
  }
}

main();
</script>
</body>
</html>
