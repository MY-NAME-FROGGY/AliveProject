<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОСТАТЬСЯ В ЖИВЫХ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root{
  --void:#15170f; --void-2:#1d2016;
  --paper:#e9e3d0; --ink:#211d13;
  --hazard:#d3a026; --hazard-dim:#8a6b1d;
  --danger:#a63d2f; --moss:#5b6b48; --redact:#141410;
}
*{box-sizing:border-box;}
body{
  margin:0; background:radial-gradient(ellipse at top,#1f2317 0%,var(--void) 60%);
  color:var(--paper); font-family:'IBM Plex Mono',monospace; min-height:100vh; padding:24px 16px 60px;
}
h1,h2,h3,.display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;margin:0;}
.wrap{max-width:920px;margin:0 auto;}
.hazard-strip{height:10px;background:repeating-linear-gradient(135deg,var(--hazard) 0 18px,var(--ink) 18px 36px);border-radius:2px;margin:14px 0 22px;opacity:0.9;}
.brand{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.brand h1{font-size:clamp(24px,5vw,40px);color:var(--paper);}
.brand h1 span{color:var(--hazard);}
.brand .sub{color:var(--hazard);font-size:12px;letter-spacing:0.15em;}
.panel{background:var(--void-2);border:1px solid #33361f;border-radius:6px;padding:20px;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--hazard);margin-bottom:6px;}
.field input, .field textarea, .field select{
  width:100%;padding:10px 11px;background:var(--void);border:1px solid #444722;color:var(--paper);
  font-family:'IBM Plex Mono',monospace;font-size:14px;border-radius:4px;
}
.btn{display:inline-block;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.05em;font-size:13px;font-weight:600;padding:11px 18px;border-radius:4px;border:none;cursor:pointer;transition:filter .15s;}
.btn:hover{filter:brightness(1.12);}
.btn-primary{background:var(--hazard);color:var(--ink);}
.btn-danger{background:var(--danger);color:#fff2e8;}
.btn-ghost{background:transparent;color:var(--paper);border:1px solid #4a4e28;}
.code-box{font-size:32px;font-weight:700;letter-spacing:0.3em;color:var(--hazard);background:var(--void);border:2px dashed var(--hazard-dim);border-radius:6px;padding:12px 8px;text-align:center;}
.lobby-list{list-style:none;padding:0;margin:0 0 16px;}
.lobby-list li{padding:9px 12px;background:var(--void);border:1px solid #33361f;border-radius:4px;margin-bottom:7px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const TRAIT_KEYS = ['profession','age','health','hobby','phobia','baggage','fact1','fact2'];
const TRAIT_LABELS = {
  profession:'Профессия', age:'Возраст и пол', health:'Здоровье',
  hobby:'Хобби', phobia:'Фобия', baggage:'Багаж', fact1:'Факт 1', fact2:'Факт 2'
};

const STORAGE_PREFIX = 'ostatsya_';

let state = {
  playerId: crypto.randomUUID(),
  playerName: '',
  code: null,
  room: null
};

function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}

function saveRoom(room) {
  localStorage.setItem(STORAGE_PREFIX + 'room_' + room.code, JSON.stringify(room));
  state.room = room;
  render();
}

function getRoom(code) {
  try {
    const data = localStorage.getItem(STORAGE_PREFIX + 'room_' + code);
    return data ? JSON.parse(data) : null;
  } catch(e) { return null; }
}

function render() {
  document.getElementById('app').innerHTML = state.room ? renderRoom(state.room) : renderHome();
}

function renderHome() {
  return `
    <div class="brand"><h1>ОСТАТЬСЯ <span>В ЖИВЫХ</span></h1><span class="sub">СОЦИАЛЬНАЯ ИГРА</span></div>
    <div class="hazard-strip"></div>
    <div class="two-col" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <div class="panel">
        <h2 style="color:var(--hazard);margin-bottom:15px;">Создать комнату</h2>
        <div class="field"><label>Твоё имя (ведущий)</label><input id="hostName" placeholder="Игорь"></div>
        <button class="btn btn-primary" onclick="actionCreateRoom()">Создать комнату</button>
      </div>
      <div class="panel">
        <h2 style="color:var(--hazard);margin-bottom:15px;">Присоединиться</h2>
        <div class="field"><label>Код комнаты</label><input id="joinCode" placeholder="ABCD" maxlength="4" style="text-transform:uppercase;letter-spacing:2px;"></div>
        <div class="field"><label>Твоё имя</label><input id="joinName" placeholder="Марина"></div>
        <button class="btn btn-primary" onclick="actionJoinRoom()">Войти в комнату</button>
      </div>
    </div>
  `;
}

function renderRoom(room) {
  const isHost = room.hostId === state.playerId;
  return `
    <div class="brand"><h1>ОСТАТЬСЯ <span>В ЖИВЫХ</span></h1><span class="sub">КОД: ${room.code}</span></div>
    <div class="hazard-strip"></div>
    <div class="panel">
      <h2>Участники (${room.players.length})</h2>
      <ul class="lobby-list">
        ${room.players.map(p => `<li>${p.name} ${p.id === room.hostId ? '(Ведущий)' : ''}</li>`).join('')}
      </ul>
    </div>
    ${isHost ? `
      <div class="panel">
        <button class="btn btn-primary" onclick="actionStartGame()">Начать игру</button>
        <button class="btn btn-ghost" onclick="actionLeaveRoom()" style="margin-left:10px;">← В главное меню</button>
      </div>
    ` : `
      <button class="btn btn-ghost" onclick="actionLeaveRoom()">← В главное меню</button>
    `}
  `;
}

function actionCreateRoom() {
  const name = document.getElementById('hostName').value.trim();
  if (!name) return alert('Введите имя!');
  const code = genCode();
  const room = {
    code,
    hostId: state.playerId,
    phase: 'lobby',
    players: [{id: state.playerId, name: name, alive: true}]
  };
  state.playerName = name;
  state.code = code;
  saveRoom(room);
}

function actionJoinRoom() {
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  const name = document.getElementById('joinName').value.trim();
  if (!code || !name) return alert('Заполните все поля!');
  
  let room = getRoom(code);
  if (!room) return alert('Комната не найдена!');
  
  if (room.players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
    return alert('Это имя уже занято!');
  }
  
  room.players.push({id: state.playerId, name: name, alive: true});
  state.playerName = name;
  state.code = code;
  saveRoom(room);
}

function actionStartGame() {
  alert('Игра началась! (полная версия с катастрофами, голосованием и т.д. будет в следующих обновлениях)');
}

function actionLeaveRoom() {
  if (confirm('Выйти из комнаты?')) {
    state.room = null;
    state.code = null;
    render();
  }
}

render();
</script>
</body>
</html>
